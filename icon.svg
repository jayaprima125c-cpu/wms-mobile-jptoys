<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background Container with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" fill-opacity="0.15" stroke="rgba(99, 102, 241, 0.4)" stroke-width="8"/>
  
  <!-- Central Badge -->
  <rect x="96" y="96" width="320" height="320" rx="64" fill="url(#bgGrad)"/>
  
  <!-- QR Code / Barcode Corner Reticles -->
  <!-- Top-Left -->
  <path d="M140 180 V150 A10 10 0 0 1 150 140 H180" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Top-Right -->
  <path d="M332 140 H362 A10 10 0 0 1 372 150 V180" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M140 332 V362 A10 10 0 0 0 150 372 H180" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M332 372 H362 A10 10 0 0 0 372 362 V332" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>

  <!-- Barcode Center Graphic -->
  <rect x="180" y="200" width="16" height="112" rx="4" fill="#ffffff"/>
  <rect x="208" y="200" width="28" height="112" rx="4" fill="#ffffff"/>
  <rect x="248" y="200" width="12" height="112" rx="4" fill="#ffffff"/>
  <rect x="272" y="200" width="32" height="112" rx="4" fill="#ffffff"/>
  <rect x="316" y="200" width="16" height="112" rx="4" fill="#ffffff"/>

  <!-- Laser Beam Line -->
  <rect x="120" y="250" width="272" height="12" rx="6" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
</svg>
